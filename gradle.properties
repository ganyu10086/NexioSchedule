# Nexio课程表 - Gradle 全局构建参数
org.gradle.jvmargs=-Xmx6144m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# CI: Kotlin/Native 链接（Release 去虚拟化分析）很吃内存
kotlin.native.jvmArgs=-Xmx6144m -XX:+UseParallelGC
org.gradle.parallel=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
android.useAndroidX=true

# 临时测试：注册 AS 自带 JBR 为本机 JDK
org.gradle.java.installations.paths=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
