name: iOS unsigned IPA (debug)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA (debug)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout Nexio
        uses: actions/checkout@v4
        with:
          path: nexio
      - name: Checkout softglass source
        uses: actions/checkout@v4
        with:
          repository: HaoZai000/softglass
          ref: '0.1.2'
          path: softglass
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          ls -1
      - name: Prebuild Kotlin framework (debug)
        working-directory: nexio
        run: |
          ./gradlew -Pnexio.ios=true :ui-shared:linkDebugFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tail -n 60
      - name: Archive no codesign
        working-directory: nexio
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nexio.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 80
      - name: Package IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/Nexio.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry NexioSchedule-debug-unsigned.ipa Payload
          ls -lh NexioSchedule-debug-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexioSchedule-debug-ipa
          path: ${{ runner.temp }}/NexioSchedule-debug-unsigned.ipa
          retention-days: 7
