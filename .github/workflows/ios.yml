name: iOS unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
      - name: Archive no codesign
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nexio.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" COMPILER_INDEX_STORE_ENABLE=NO archive 2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -n 80
      - name: Package IPA
        run: |
          set -e
          APP=$(find "$RUNNER_TEMP/Nexio.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)
          echo "app=$APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry NexioSchedule-unsigned.ipa Payload
          ls -lh NexioSchedule-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NexioSchedule-unsigned-ipa
          path: ${{ runner.temp }}/NexioSchedule-unsigned.ipa
          retention-days: 7
